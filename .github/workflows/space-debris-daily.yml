name: Daily space debris snapshot

on:
  schedule:
    # 11:00 UTC every day. GitHub may start the job a little later.
    - cron: "0 11 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: space-debris-daily
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r space-debris/requirements.txt

      - name: Collect today's close passes
        id: collect
        run: |
          date_utc=$(date -u +%Y-%m-%d)
          output="space-debris/history/close_passes_${date_utc}.csv"
          mkdir -p space-debris/history
          # One process, so CelesTrak is asked once for stations and once for debris.
          python3 space-debris/close_pass.py --output "$output"
          echo "output=$output" >> "$GITHUB_OUTPUT"
          echo "date_utc=$date_utc" >> "$GITHUB_OUTPUT"

      - name: Commit the history file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The raw TLE cache stays untracked. Only this day's CSV is committed.
          git add "${{ steps.collect.outputs.output }}"
          if git diff --cached --quiet; then
            echo "History file already matches this run."
            exit 0
          fi
          git commit -m "Add daily ISS close-pass snapshot for ${{ steps.collect.outputs.date_utc }}"
          git pull --rebase origin main
          git push origin HEAD:main
